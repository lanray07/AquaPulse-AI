name: Xcode Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build iOS app
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build for iOS simulator
        run: |
          xcodebuild \
            -project AquaPulseAI.xcodeproj \
            -scheme AquaPulseAI \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
