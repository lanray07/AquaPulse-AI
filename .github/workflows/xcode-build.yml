name: Xcode Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build iOS app
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode project info
        run: |
          xcodebuild -version
          xcodebuild -list -project AquaPulseAI.xcodeproj

      - name: Build for iOS simulator
        run: |
          mkdir -p build
          xcodebuild \
            -project AquaPulseAI.xcodeproj \
            -scheme AquaPulseAI \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/AquaPulseAI.xcresult \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload Xcode result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AquaPulseAI-xcresult
          path: build/AquaPulseAI.xcresult
          if-no-files-found: ignore
